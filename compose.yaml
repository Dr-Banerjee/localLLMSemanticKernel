services:
  postgres:
    image: postgres:18-alpine
    container_name: localllm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d local_llm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: