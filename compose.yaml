services:
  postgres:
    image: postgres:18-alpine
    container_name: localllm-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localllm-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: ${APP_ENV}
      ANONYMOUS_SESSION_LIFETIME_DAYS: ${ANONYMOUS_SESSION_LIFETIME_DAYS}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "127.0.0.1:8001:8000" #for production only. Need to supply it properply based on the environment
    depends_on:
      postgres:
        condition: service_healthy
  ollama:
    image: ollama/ollama:latest
    container_name: localllm-ollama
    volumes:
      - ollama_data:/root/.ollama
  frontend:
    build:
      context: ./appFrontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: localllm-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data: