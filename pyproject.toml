[project]
name = "local-llm-semantic-kernel-app"
version = "0.1.0"
description = "Python application using Semantic Kernel with a local LFM 2.5 model"
requires-python = ">=3.11"

dependencies = [
    "semantic-kernel",
    "pydantic",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "requests",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "ollama",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["app"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/tests/*",
    "app/test_*.py",
    "app/**/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]
